  const card=`<article class="project" id="campaign-operations-card"><div><p class="project-number">01 / AI AGENT PRODUCT CASE STUDY &amp; INTERACTIVE DEMO</p><h3>Campaign Operations Intelligence</h3><p class="summary">AI agents for campaign investigation, inventory recovery and launch decisions.</p><p class="scope">Explore an interactive product demonstration of autonomous stock recovery, protected inventory, human approvals and auditable decisions. Fictional campaign data and simulated agent behavior.</p><div class="actions"><a class="button primary" href="#campaignops">Read case study →</a><a class="button" href="#campaignops-demo">Try interactive demo ↗</a></div><div class="tags"><span class="tag">AI agents</span><span class="tag">Campaign operations</span><span class="tag">Human-in-the-loop</span><span class="tag">Product demo</span></div></div><div class="visual screenshot-visual ai-visual"><a class="screen-link" href="#campaignops-demo" aria-label="Open Campaign Operations Intelligence interactive demo"><div class="screen-window"><div class="screen-chrome"><span class="window-dots"><i></i><i></i><i></i></span><span>CAMPAIGN OPERATIONS / AGENT WORKSPACE</span><span class="screen-arrow">↗</span></div><div class="screen-image"><img src="${imageMatch[1]}" alt="Straight screenshot of the interactive campaign operations agent workspace" loading="lazy"></div></div><div class="screen-caption"><span>Stock recovery · Forecast attainment · Approvals</span><span>Explore the interactive demo ↗</span></div></a></div></article>`;
  const work=source.indexOf('<section id="work"><div class="section-title">');if(work<0)throw Error('Selected work section not found.');
  const insert=source.indexOf('<article class="project">',work);if(insert<0)throw Error('Project card insertion point not found.');
  source=source.slice(0,insert)+card+source.slice(insert);
  const css='<style>.visual.ai-visual{background:linear-gradient(145deg,var(--sage),var(--surface));min-width:0}.visual.ai-visual .screen-image{aspect-ratio:1.7;background:#fff}.visual.ai-visual .screen-image img{object-fit:contain;object-position:center;transform:none}.visual.ai-visual .screen-link:hover .screen-image img{transform:none}@media(max-width:650px){.reader-nav{flex-wrap:wrap;gap:7px 12px}.reader-nav a{font-size:11px}.visual.ai-visual .screen-image{aspect-ratio:1.5}}</style>';
  source=replaceOne(source,'</head>',css+'</head>');
  const p=source.indexOf(marker)+marker.length;const q=source.indexOf('<\/script>',p);const finalDocs=JSON.parse(source.slice(p,q));
  for(const [key,html] of Object.entries(old))if(finalDocs[key]!==html)throw Error('Existing '+key+' content was unexpectedly changed.');
  if(!(source.indexOf('id="campaign-operations-card"')<source.indexOf('02 / RETAIL AUTOMATION')&&source.indexOf('02 / RETAIL AUTOMATION')<source.indexOf('03 / PARTNER ONBOARDING')&&source.indexOf('03 / PARTNER ONBOARDING')<source.indexOf('04 / WEALTH EXPERIENCE')))throw Error('Project order validation failed.');
  return source;
}

async function getSource(){
 let lastError;
 for(const url of [sourceUrl,backupUrl]){
  try{
   const response=await fetch(url,{cache:'force-cache'});
   if(!response.ok)throw Error('HTTP '+response.status);
   const text=await response.text();
   if(!text.includes('id="projectDocuments"')||!text.includes('Autonomous Campaign Creation'))throw Error('Unexpected portfolio source');
   return text;
  }catch(e){lastError=e;}
 }
 throw lastError||Error('Could not load portfolio');
}
let started=false;
async function launch(){
 if(started)return;started=true;
 document.getElementById('err').classList.remove('show');
 document.getElementById('loading').classList.remove('hide');
 try{
  const source=await getSource();
  const updated=patchPortfolio(source);
  // This reconstructs the original, unmodified ACC / PartnerPath / PortBridge
  // pages from an immutable GitHub revision, adding the AI-agent project first.
  document.open();document.write(updated);document.close();
 }catch(e){
  started=false;
  document.getElementById('loading').classList.add('hide');
  document.getElementById('err').classList.add('show');
  console.error('Portfolio could not be loaded:',e);
 }
}
document.getElementById('retry').addEventListener('click',launch);
document.getElementById('newCase').addEventListener('click',()=>{
 document.open();document.write(caseHtml);document.close();
});
launch();
})();
</script>
