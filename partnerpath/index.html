ong`,{className:`text-[#20201E] block font-semibold truncate`,children:i.assignedCustomerSuccess.name}),(0,U.jsx)(`p`,{className:`text-[11px] text-[#5E5A54] truncate`,children:`Integration Manager`})]})]})})]})]})},ct=[{id:`SEC-101`,title:`Company Details & German Commercial Register`,category:`Business Verification`,summary:`Requirements for German commercial register (Handelsregister HRB/HRA), VAT ID, and bank account verification.`,relatedStage:`business_details`,content:[`Retail partners operating in the German marketplace must provide their registered legal entity name as recorded in the Handelsregister.`,`Registration references follow the format "HRB [Number] [District]" for corporations (GmbH/AG) or "HRA [Number]" for sole traders and partnerships (e.K./OHG/KG).`,`The VAT identification number (USt-IdNr.) must begin with DE followed by 9 digits.`,`Bank accounts must use a valid SEPA IBAN starting with DE and a valid BIC. Verification is carried out by internal review.`]},{id:`SEC-201`,title:`Store Master Import & Leading Zero Handling`,category:`Store Setup`,summary:`Guidelines for store addresses, Germany-only v1 restriction, and text formatting for postal codes and ERP IDs.`,relatedStage:`stores`,content:[`In version 1, all retail store locations must be located within the Federal Republic of Germany.`,`German postal codes are 5 digits. Because regions in Saxony and Thuringia have postal codes beginning with 0 (e.g. 01067 Dresden, 04109 Leipzig), postal codes must be formatted as strings/text to avoid truncating leading zeros.`,`ERP Store IDs are similarly handled as strings to preserve leading zeros (e.g. "0042").`,`Excel imports require the exact sheet name "Store Information" and exact headers. The import is atomic: no rows are created if any single row contains an error.`]},{id:`SEC-202`,title:`Partner Tiers & Requirement Recalculation`,category:`Tiering & Architecture`,summary:`How store counts dictate Tier 1 (>10), Tier 2 (5-10), and Tier 3 (<5) and dynamic requirement updates.`,relatedStage:`stores`,content:[`Tier 1 (more than 10 stores): Receives dedicated assisted onboarding, requires digital tests for all stores, and requires one physical test order at one nominated store.`,`Tier 2 (5 to 10 stores): Receives assisted onboarding and requires digital tests for all stores. Physical testing is not required.`,`Tier 3 (fewer than 5 stores): Guided self-service onboarding with full access to human escalation. Requires digital tests only.`,`If store counts cross tier thresholds (for example, adding an 11th store), requirements are automatically recalculated without losing completed work.`]},{id:`SEC-301`,title:`Delivery Paths: Marketplace-Arranged vs Partner-Arranged`,category:`Logistics`,summary:`Differences between carrier credentials, label generation, and logistics responsibility.`,relatedStage:`delivery`,content:[`Marketplace-arranged logistics: The marketplace shipping contracts are utilized. The partner does not input carrier credentials; the marketplace team verifies logistics connectivity.`,`Partner-arranged logistics: The partner uses existing contracts with carriers (DHL Express DE, DPD, Hermes). Integration credentials (API Client ID and Secret) must be provided.`,`Integration credentials differ from your public consumer website login password. Contact your carrier account representative for B2B API keys.`]},{id:`SEC-401`,title:`Inventory Feed Connection & CSV Schema`,category:`Technical Integration`,summary:`Hourly automated inventory feeds, API client authentication, and mapping error resolution.`,relatedStage:`inventory`,content:[`Partners transmit inventory and pricing updates via REST API or SFTP using their unique Client ID and API Key.`,`Standard CSV schema: "erp_store_id,sku,ean,quantity,price_eur,currency".`,`The ERP Store ID must match an active registered store in PartnerPath.`,`A feed confirmation validates transmission syntax and store mapping, but does not mean articles are approved or the store is live.`]},{id:`SEC-501`,title:`Article Assortment: Catalogue Matching & Creation`,category:`Assortment`,summary:`EAN barcodes, master catalogue matching, new article submission, and store-level article eligibility.`,relatedStage:`articles`,content:[`Route 1: Match existing marketplace catalogue. If your EAN matches an existing product in the catalog, images and descriptions are pre-filled.`,`Route 2: Create new articles. For proprietary or uncatalogued items, submit high-resolution imagery, German title, and mandatory attributes.`,`Unresolved or rejected articles cannot be used for test orders. Partners may explicitly exclude items without delaying store readiness.`,`Each store must have at least one eligible in-stock article before test orders can proceed.`]},{id:`SEC-601`,title:`Digital & Physical Test Protocols`,category:`Testing & Quality`,summary:`Step-by-step digital simulation order fulfilment and one Tier 1 physical test order.`,relatedStage:`tests`,content:[`Digital test: Creates a contained mock test order for the store. The partner simulates picking, generates a mock shipping label, confirms packing, and validates a dummy return label.`,`Crucial rule: Partners must complete the digital test workflow in PartnerPath, but must NOT physically dispatch goods or ship real parcels.`,`Physical test order (Tier 1 only): One nominated store completes the partner-wide physical test with an onboarding specialist. It is not repeated for every store.`,`Operational readiness checks include packaging supplies, dedicated label printer, and store staff training.`]},{id:`SEC-701`,title:`Store Readiness & Activation Rules`,category:`Activation`,summary:`Prerequisites for activation, Integration Manager sign-off, and future retail operations tools.`,relatedStage:`activation`,content:[`A store cannot be activated until all dependencies are satisfied: Business review approved, delivery confirmed, inventory feed active, eligible articles assigned, and required tests passed.`,`Final review is conducted by the Integration Manager (IM). Only stores with "Approved to activate" status can be launched.`,`The partner retains control over launch timing: activation happens only when the partner clicks "Activate my store".`,`Until activation is confirmed, the store is offline and cannot accept live customer purchases.`]}],lt={overview:[{question:`What is PartnerPath?`,answer:`PartnerPath is the dedicated onboarding portal for independent retail partners joining our German marketplace. It guides you step-by-step from business verification to store activation.`,sectionRef:`SEC-101`},{question:`How is my tier calculated?`,answer:`Tiers are calculated strictly by your store count: more than 10 stores = Tier 1; 5 to 10 stores = Tier 2; fewer than 5 stores = Tier 3. Tiers adjust automatically if you add or remove stores.`,sectionRef:`SEC-202`},{question:`Can I request human support even if I am in Tier 3?`,answer:`Yes. All tiers have direct access to request human help from our partner onboarding operations desk at any time.`,sectionRef:`SEC-202`}],business_details:[{question:`What commercial registration format is expected?`,answer:`Enter your German commercial register entry such as "HRB 12345 (Amtsgericht Berlin)" or "HRA 12345" for sole proprietorships.`,sectionRef:`SEC-101`},{question:`Why must the bank account be in the SEPA zone?`,answer:`Marketplace payouts to German retail partners are processed exclusively in EUR via SEPA bank transfers.`,sectionRef:`SEC-101`},{question:`Does the format check prove legal identity?`,answer:`No. The syntax validation only checks standard format rules. Legal verification is carried out during simulated internal review.`,sectionRef:`SEC-101`}],stores:[{question:`Why did my postal code lose its leading zero in Excel?`,answer:`Spreadsheets often treat postal codes as numbers and drop leading zeros (e.g. 01067 becomes 1067). Make sure the column format in Excel is set to Text before saving.`,sectionRef:`SEC-201`},{question:`Can I import stores outside Germany?`,answer:`In version 1, only retail branches situated within Germany are supported.`,sectionRef:`SEC-201`},{question:`What happens if one row in my Excel file is invalid?`,answer:`The import is strictly atomic. If even one row fails validation, zero stores are imported until all errors are corrected.`,sectionRef:`SEC-201`}],delivery:[{question:`What is the difference between marketplace-arranged and partner-arranged delivery?`,answer:`With marketplace-arranged delivery, our collective carrier agreements are used and we handle the technical carrier setup. With partner-arranged delivery, you use your own carrier contract and provide API credentials.`,sectionRef:`SEC-301`},{question:`Are integration credentials the same as my carrier login password?`,answer:`No. Integration credentials are API Client IDs and tokens generated for automated shipping systems, not your personal website login.`,sectionRef:`SEC-301`}],inventory:[{question:`How frequently does the inventory feed sync?`,answer:`In production, inventory and price feeds are polled or received hourly. In this prototype, you can trigger simulated feed receipts.`,sectionRef:`SEC-401`},{question:`Does a successful feed receipt mean my store is live?`,answer:`No. Feed receipt only verifies that stock quantities and prices were received and mapped to valid ERP IDs.`,sectionRef:`SEC-401`}],articles:[{question:`What is catalogue matching?`,answer:`If your products have standardized EAN/GTIN barcodes that already exist in our German marketplace catalogue, all imagery and descriptions are linked automatically.`,sectionRef:`SEC-501`},{question:`What happens to unmatched or rejected articles?`,answer:`Unmatched articles can be created via the new article form or explicitly excluded. They will not be eligible for test orders until approved.`,sectionRef:`SEC-501`}],tests:[{question:`Should I dispatch real packages for the digital test?`,answer:`No! You must never send real merchandise or dispatch physical packages for digital test orders. This is a simulation workflow only.`,sectionRef:`SEC-601`},{question:`Why does Tier 1 require a physical test?`,answer:`Partners with more than 10 store branches require physical packaging, thermal label alignment, and barcode scanner verification to prevent fulfillment bottlenecks at volume.`,sectionRef:`SEC-601`}],activation:[{question:`Can a store go live automatically once approved?`,answer:`No. You retain complete control over the launch date. You must explicitly click "Activate my store" or "Activate my selected stores".`,sectionRef:`SEC-701`},{question:`What is the future Retail Operations tool?`,answer:`PartnerPath is solely for onboarding. Once stores are activated, daily order processing, customer communication, and return handling take place in the separate Retail Operations tool.`,sectionRef:`SEC-701`}],help:[{question:`How do I contact my assigned Integration Manager?`,answer:`Use the "Contact your Integration Manager" tab or contact details displayed in your partner workspace. Your request is logged with your full technical context.`,sectionRef:`SEC-101`}]};function ut(e,t,n){let r=e.toLowerCase().trim();if(r.includes(`approve my store`)||r.includes(`activate my store`)||r.includes(`change my api key`)||r.includes(`mark test passed`)||r.includes(`pass test`))return{answer:`I am a simulated guidance assistant and cannot perform privileged actions such as approving verification, modifying credentials, marking tests as passed, or activating stores. These actions must be completed via the official workflow steps or reviewed by your assigned Integration Manager.`,canEscalate:!0,contextSummary:`Restricted administrative action requested.`};let i=[];for(let e of ct){let t=0,a=(e.title+` `+e.summary+` `+e.content.join(` `)).toLowerCase(),o=r.split(/\s+/).filter(e=>e.length>2);for(let n of o)a.includes(n)&&(t+=2),e.title.toLowerCase().includes(n)&&(t+=4);e.relatedStage===n&&(t+=3),t>3&&i.push({sec
